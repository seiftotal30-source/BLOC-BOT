[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2
upload_speed = 115200  ; this board's CP2102 stalls at higher speeds

; the other con: same 1.3" sh1106, wired to the default i2c pins 21 / 22
; flash it with: pio run -e con_oled_21_22 -t upload
[env:con_oled_21_22]
extends = env:esp32dev
build_flags = -DOLED_SDA=21 -DOLED_SCL=22
